<!DOCTYPE html>
<html>

<head>
    <title>Login - TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h2>Login</h2>

    <input id="loginEmail"
           type="email"
           placeholder="Email">

    <input id="loginPassword"
           type="password"
           placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
