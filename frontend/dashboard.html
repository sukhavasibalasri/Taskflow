<!DOCTYPE html>
<html>

<head>

    <title>TaskFlow Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- TOOLBAR -->

<nav class="navbar">

    <div class="logo">
        TaskFlow
    </div>

    <div class="nav-right">

        <span id="welcomeUser">
            Welcome
        </span>

        <button class="logout-btn"
                onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<!-- MAIN DASHBOARD -->

<div class="dashboard">

    <div class="dashboard-header">

        <div>
            <h1>My Tasks</h1>

            <p>
                Organize your work and stay productive.
            </p>
        </div>

    </div>


    <!-- ADD TASK -->

    <div class="add-task-card">

        <h2>Add New Task</h2>

        <input
            id="title"
            type="text"
            placeholder="Task title">

        <input
            id="description"
            type="text"
            placeholder="Task description">

        <select id="priority">

            <option value="LOW">
                Low Priority
            </option>

            <option value="MEDIUM" selected>
                Medium Priority
            </option>

            <option value="HIGH">
                High Priority
            </option>

        </select>

        <button
            class="add-btn"
            onclick="addTask()">

            + Add Task

        </button>

    </div>


    <!-- SEARCH -->

    <div class="task-controls">

        <input
            id="search"
            type="text"
            placeholder="🔍 Search tasks..."
            onkeyup="loadTasks()">

        <select
            id="statusFilter"
            onchange="loadTasks()">

            <option value="ALL">
                All Tasks
            </option>

            <option value="PENDING">
                Pending
            </option>

            <option value="COMPLETED">
                Completed
            </option>

        </select>

    </div>


    <!-- TASK LIST -->

    <div id="taskList"></div>

</div>


<script src="script.js"></script>

</body>

</html>
