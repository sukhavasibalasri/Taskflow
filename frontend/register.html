<!DOCTYPE html>
<html>

<head>
    <title>Register - TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h2>Create Account</h2>

    <input id="name"
           type="text"
           placeholder="Name">

    <input id="email"
           type="email"
           placeholder="Email">

    <input id="password"
           type="password"
           placeholder="Password">

    <button onclick="register()">Register</button>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
